services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: mc_status
    ports:
      # 5433 снаружи: на Windows-машинах на 5432 часто живёт локальный Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc_status"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
