# Проект Xcode описан здесь; .xcodeproj генерирует `xcodegen generate` (в git не попадает).
name: MiddleCorridor
options:
  bundleIdPrefix: com.malakhouski
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Personal Team (бесплатный Apple ID) выбирается в Xcode → Signing & Capabilities
    DEVELOPMENT_TEAM: ""
packages:
  MCCore:
    path: MCCore
targets:
  MiddleCorridor:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MCCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Middle Corridor
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.malakhouski.mcstatus
            CFBundleURLSchemes: [mcstatus]
        # Демо-бэкенд — http на Маке: localhost (симулятор) или IP в Wi‑Fi (iPhone)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Приложение берёт данные с сервера Middle Corridor в вашей локальной сети.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malakhouski.mcstatus
        PRODUCT_NAME: MiddleCorridor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  MiddleCorridor:
    build:
      targets:
        MiddleCorridor: all
    run:
      config: Debug
