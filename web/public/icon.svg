<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0f1216"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- лента коридора: Констанца → Каспий → Хоргос -->
  <path d="M64 322 C 140 300, 170 250, 226 262 S 330 236, 372 198 S 430 150, 452 138" fill="none" stroke="#8f86e6" stroke-width="26" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <path d="M64 322 C 140 300, 170 250, 226 262 S 330 236, 372 198 S 430 150, 452 138" fill="none" stroke="#8f86e6" stroke-width="10" stroke-linecap="round"/>
  <!-- морской участок пунктиром -->
  <path d="M226 262 S 330 236, 372 198" fill="none" stroke="#0f1216" stroke-width="10" stroke-linecap="round" stroke-dasharray="0.1 22"/>
  <!-- порты -->
  <circle cx="226" cy="262" r="20" fill="#fab219" stroke="#fff" stroke-width="6"/>
  <circle cx="372" cy="198" r="20" fill="#0ca30c" stroke="#fff" stroke-width="6"/>
  <!-- груз -->
  <circle cx="300" cy="238" r="26" fill="#2fd39a" stroke="#fff" stroke-width="7"/>
  <!-- ветер -->
  <path d="M96 420 h120 M120 452 h150 M150 388 h90" stroke="#86b6ef" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M216 420 l-18 -14 M216 420 l-18 14 M270 452 l-18 -14 M270 452 l-18 14 M240 388 l-18 -14 M240 388 l-18 14" stroke="#86b6ef" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
</svg>
